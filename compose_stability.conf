// Types the Compose compiler cannot see inside, but which this app only ever holds immutably.
// Without these every row of the gallery recomposes on every state emission, because one unstable
// parameter is enough to stop a composable skipping -- and a row's text layout is a novel typeface
// each time, which is the most expensive thing on the screen to redo.

// Font.lastModified. Read-only once parsed, never mutated.
java.time.LocalDate

// The resolved faces. A Typeface is immutable once created; TypefaceLoader only ever publishes
// finished ones and never hands back a face it is still working on.
android.graphics.Typeface

// The catalog, the resolved faces, the favourites and the selected categories. Every one of these is
// rebuilt through copy() rather than mutated in place, which is the promise this line makes.
kotlin.collections.*

// cuts and defaultCut are `by lazy`, which leaves a Lazy field behind on Font.
kotlin.Lazy
